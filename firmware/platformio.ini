; GPS_Localize - ESP32 firmware
;
; Build (Ubuntu 22.04, ROS 2 Humble sourced so ${sysenv.ROS_DISTRO} = humble):
;   source /opt/ros/humble/setup.bash
;   pio run -e wifi -t upload          # normal, talks to the agent over Wi-Fi
;   pio run -e serial -t upload        # fallback, agent over USB serial
;
; Stay on platform espressif32 @ ^6.5.0 (arduino-esp32 core 2.0.x). Core 3.x
; renamed the LEDC API used in lib/motor/motor_tb6612.h.

[platformio]
; This project lives on an NTFS partition mounted with `windows_names`, which
; refuses to create paths containing reserved DOS device names. The micro-ROS
; build makes a directory literally called "aux", so `mkdir` fails with EINVAL
; and the build dies before compiling anything. Keep the whole PlatformIO
; workspace (.pio: build output + libdeps) on the Linux filesystem instead.
workspace_dir = ${sysenv.HOME}/.pio_workspaces/GPS_Localize
default_envs = wifi

; ---------------------------------------------------------------------------
; Shared ESP32 settings. This is a plain section, not an [env:...], so the
; host-test environment below does not inherit `board` / `framework` from it.
; ---------------------------------------------------------------------------
[esp32_base]
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
; The default 460800 makes esptool lose the chip right after the stub loads
; ("Unable to verify flash chip connection") on this USB-serial adapter.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_microros_distro = ${sysenv.ROS_DISTRO}
board_microros_user_meta = colcon.meta
; deep+ so the header-only libraries in lib/ (estimator, control, safety) are
; resolved even when they are included from another library header
lib_ldf_mode = deep+
lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	Wire
	SPI
	ArduinoOTA
	Update
	ESPmDNS
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit BNO08x@^1.2.5
	; Local library in lib/PIDF. Named explicitly because the dependency
	; finder discovers local libraries from what src/main.cpp includes, and
	; PIDF.h is now reached only through src/control/drive_controller.h.
	; Without this the header is found but PIDF.cpp is never compiled, and
	; the link fails on PIDF::PIDF.
	PIDF
build_flags =
	-I config
	; lib/ holds reusable drivers and generic code; src/ holds the parts that
	; only make sense for THIS robot.
	;
	; Both are listed explicitly rather than left to the library dependency
	; finder. The LDF infers lib/ include paths from what src/main.cpp pulls
	; in, so a header that lives in src/ and includes one from lib/ - as
	; src/control/drive_controller.h does with PIDF.h - is not resolved. Being
	; explicit means the build does not depend on that inference.
	-I lib/PIDF
	-I lib/gps
	-I lib/ina226
	-I lib/imu
	-I lib/motor
	-I lib/compass
	-I src/estimator
	-I src/control
	-I src/safety
	-I src/power
	-I src/net
	-I src/params
	-D __PGMSPACE_H_
	-D USE_ESP32_CONFIG

[env:wifi]
extends = esp32_base
board_microros_transport = wifi
build_flags =
	${esp32_base.build_flags}
	-D MICROROS_TRANSPORT_WIFI

# Same firmware as [env:wifi], flashed over the network instead of a cable.
# Use it once the board is bolted into the robot:
#
#     pio run -e wifi_ota -t upload
#
# The board must already be running an OTA-capable image - a first cable flash
# is unavoidable, because the running firmware is what accepts the update.
#
# The upload is refused unless the motor rails are dead and the robot is still.
# Reflashing takes seconds, and for all of them the motors would hold their last
# duty with no code running to change it.
#
# upload_port takes the mDNS name; replace it with the board's IP if your
# network does not resolve .local names.
[env:wifi_ota]
extends = env:wifi
upload_protocol = espota
upload_port = esp32-gps-localize.local
upload_flags =
	--auth=gpslocalize
	--port=3232

[env:serial]
extends = esp32_base
board_microros_transport = serial
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ---------------------------------------------------------------------------
; Host tests:  pio test -e native
; Runs the control logic (PIDF, estimator, drive controller, safety chain, NMEA
; parser) on the PC against a fake clock and a fake serial port - no board
; needed. Hardware drivers (I2C, LEDC, micro-ROS) are not part of this env.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; The LDF has to run here: Unity is injected as a library dependency by the
; test runner, so `lib_ldf_mode = off` leaves unity.h off the include path and
; unity.c unbuilt. `chain` picks up Unity plus the lib/ folders the tests
; include; `lib_compat_mode = off` keeps them from being rejected as
; arduino/espressif32-only on the native platform.
lib_ldf_mode = chain
lib_compat_mode = off
test_build_src = yes
; lib/PIDF is the only lib/ folder with a .cpp, and the LDF now compiles it as
; a library - listing it here as well would duplicate every symbol in it.
build_src_filter = -<*> +<../test/mock/mock_arduino.cpp>
build_flags =
	-std=gnu++17
	-Wall
	-I config
	-I test/mock
	-I lib/PIDF
	-I lib/gps
	-I src/estimator
	-I src/control
	-I src/safety
	-I src/power
	-I src/net
	-I src/params
	-D UNIT_TEST
	-D MOCK_ARDUINO

# The BNO085 on its own, with nothing else running at all.
#
#     pio run -e imu_only -t upload
#     pio device monitor -e imu_only
#
# WHY A WHOLE ENVIRONMENT FOR ONE SENSOR. On the real firmware it is impossible
# to say WHY the IMU failed to start, because a dozen other things are running
# on the same board: Wi-Fi, micro-ROS, a 100 Hz control loop, four INA226s and a
# magnetometer sharing the I2C bus, and motors switching amps a few centimetres
# away. Any of those could be the cause and none can be ruled out from inside a
# system running all of them.
#
# This builds ONLY tools_imu/imu_only.cpp - no micro-ROS, no Wi-Fi, no motors,
# nothing else touched on the bus. If the sensor comes up here and not in the
# firmware, the sensor is fine and the problem is contention or timing. If it
# fails here too, it is the sensor or the wiring, and no firmware change will
# help. Either answer is worth more than another guess.
#
# It deliberately does NOT extend esp32_base: pulling in micro_ros_platformio
# would drag the whole ROS stack into a tool whose entire purpose is to have
# none of it.
[env:imu_only]
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../tools_imu/imu_only.cpp>
lib_deps =
	Wire
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit BusIO
	adafruit/Adafruit Unified Sensor
